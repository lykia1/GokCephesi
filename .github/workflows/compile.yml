name: Derleme Kontrolu
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        unity: ["2022.3.*", "6000.*"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Unity kutuphaneleriyle derle
        shell: bash
        run: |
          set +e
          dotnet build ci/CompileCheck.csproj -c Release "-p:UnityVersion=${{ matrix.unity }}" -clp:NoSummary > build.log 2>&1
          code=$?
          cat build.log
          # Hatalari GitHub uyarisi (annotation) olarak goster
          grep -E "error|warning NU" build.log | sed -E 's#^.*/(Assets/[^ (]+)\(([0-9]+),[0-9]+\): #\1:\2 #' | sort -u | head -45 | while IFS= read -r line; do echo "::error::$line"; done
          exit $code
